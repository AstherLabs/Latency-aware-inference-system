# Optional monitoring stack on the existing deployment network.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports: ['127.0.0.1:9090:9090']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?Set a private Grafana administrator password}'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
volumes:
  prometheus_data:
  grafana_data:
networks:
  default:
    external: true
    name: deploy_default
