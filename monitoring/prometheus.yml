# Prometheus connects to the API using its Compose service name.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/runtime.yml

scrape_configs:
  - job_name: inference-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
